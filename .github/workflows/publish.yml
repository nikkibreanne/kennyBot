# Publish on a HAND-PUSHED version tag — the hotfix / escape hatch path.
#
# The normal route is release.yml (release-please), which publishes inside its own
# run. This workflow covers the case where a human pushes `vX.Y.Z` directly: those
# events DO trigger workflows, unlike tags created by GITHUB_TOKEN.
#
# Both paths call the same reusable docker-publish.yml, so the image is built
# identically however the release was cut.
#
# DEFERRED (owner, 2026-08-10): a `workflow_dispatch` DRY RUN — build the image
# but pass `push: false` — so a Dockerfile or build-pipeline change can be
# exercised without cutting a release. Today neither path is reachable from a PR
# (docker-publish.yml is workflow_call-only; this one needs a pushed v* tag), so
# a change like the setup-buildx major bump is first exercised BY the release it
# could break. Deliberately not built yet: it adds a manually-triggerable job
# with `packages: write` in scope, and the current risk is judged acceptable.
name: publish

on:
  push:
    tags: ['v*'] # publish only on version tags — not every push to main

permissions: {}

jobs:
  # docker-publish takes the version WITHOUT the leading v (it's the image tag);
  # GitHub expressions have no string-replace, so strip it in a shell step.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.strip.outputs.version }}
    steps:
      - id: strip
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: meta
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ github.ref_name }}
      version: ${{ needs.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
