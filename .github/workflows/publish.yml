# Publish on a HAND-PUSHED version tag — the hotfix / escape hatch path.
#
# The normal route is release.yml (release-please), which publishes inside its own
# run. This workflow covers the case where a human pushes `vX.Y.Z` directly: those
# events DO trigger workflows, unlike tags created by GITHUB_TOKEN.
#
# Both paths call the same reusable docker-publish.yml, so the image is built
# identically however the release was cut.
name: publish

on:
  push:
    tags: ['v*'] # publish only on version tags — not every push to main

permissions: {}

jobs:
  # docker-publish takes the version WITHOUT the leading v (it's the image tag);
  # GitHub expressions have no string-replace, so strip it in a shell step.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.strip.outputs.version }}
    steps:
      - id: strip
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: meta
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ github.ref_name }}
      version: ${{ needs.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
